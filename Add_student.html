<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Library Management</title>
    <link rel="stylesheet" href="library_theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="add-member-page">
    <header>
        <h1>Library Management System</h1>
        <i class="fa-solid fa-book-open" id="header-book"></i>
        <i class="fa-regular fa-bell" id="bell"></i>
        <i class="fa-solid fa-user" id="user"></i>
        <select class="admin_user" onchange="window.location.href = this.value">
            <option value="">Login</option>
            <option value="login_page.html">Admin</option>
        </select>
        <p>Manage Books, Students and Library Resources</p>
    </header>

    <aside class="sidebar">
        <ul>
            <li><a href="Home_page.html"><i class="fa-solid fa-chart-simple"></i> Dashboard</a></li>
            <li class="sidebar-menu-item">
                <div class="sidebar-menu-label">
                    <i class="fa-solid fa-user-plus"></i>
                    <select class="sidebar-select" onchange="navigateFromSidebar(this)">
                        <option value="">Add member</option>
                        <option value="Add_student.html" selected>Add Students</option>
                        <option value="Add_teacher.html">Add Teachers</option>
                        <option value="Add_other_member.html">Other members</option>
                    </select>
                </div>
            </li>
            <li class="sidebar-menu-item">
                <div class="sidebar-menu-label">
                    <i class="fa-solid fa-user-minus"></i>
                    <select class="sidebar-select" onchange="navigateFromSidebar(this)">
                        <option value="">Remove member</option>
                        <option value="Remove_student.html">Remove Students</option>
                        <option value="Remove_teacher.html">Remove Teachers</option>
                        <option value="Remove_other_member.html">Other members</option>
                    </select>
                </div>
                <div class="sidebar-submenu"></div>
            </li>
            <li class="sidebar-menu-item">
                <div class="sidebar-menu-label">
                    <i class="fa-solid fa-book"></i>
                    <select class="sidebar-select" onchange="navigateFromSidebar(this)">
                        <option value="">Books Issue</option>
                        <option value="Issue_student.html">Students</option>
                        <option value="Issue_teacher.html">Teacher</option>
                        <option value="Issue_other_member.html">Other members</option>
                    </select>
                </div>
                <div class="sidebar-submenu"></div>
            </li>
            <li class="sidebar-menu-item">
                <div class="sidebar-menu-label">
                    <i class="fa-solid fa-rotate-left"></i>
                    <select class="sidebar-select" onchange="navigateFromSidebar(this)">
                        <option value="">Return Books</option>
                        <option value="Return_student.html">Students</option>
                        <option value="Return_teacher.html">Teacher</option>
                        <option value="Return_other_member.html">Other members</option>
                    </select>
                </div>
                <div class="sidebar-submenu"></div>
            </li>
            <li><a href="#"><i class="fa-solid fa-file-lines"></i> Report</a></li>
            <li><a href="#" class="help-link"><i class="fa-solid fa-circle-question help-icon"></i> Help</a></li>
            <li><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <nav class="breadcrumb">
            <span>Dashboard</span>
            <span>&rsaquo;</span>
            <span>Students</span>
            <span>&rsaquo;</span>
            <span class="active">Add Student</span>
        </nav>

        <div class="page-header">
            <div class="header-icon"><i class="fa-solid fa-user-graduate" aria-hidden="true"></i></div>
            <div>
                <h2>Add Student</h2>
                <p>Register a new student in the library system</p>
            </div>
        </div>

        <form class="card-form">
            <div class="form-layout">
                <div class="form-fields-grid">
                    <div class="input-group">
                        <label>Library Card No. <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <span class="icon"><i class="fa-solid fa-id-card" aria-hidden="true"></i></span>
                            <input type="text" placeholder="Enter Library Card Number">
                        </div>
                        <span class="helper-text">(Primary ID for Book Issue / Return)</span>
                    </div>

                    <div class="input-group">
                        <label>Student Name <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <span class="icon"><i class="fa-solid fa-user" aria-hidden="true"></i></span>
                            <input type="text" placeholder="Enter full name">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Roll Number <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <span class="icon"><i class="fa-solid fa-hashtag" aria-hidden="true"></i></span>
                            <input type="text" placeholder="Enter roll number">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Enrollment Number</label>
                        <div class="input-wrapper">
                            <span class="icon"><i class="fa-solid fa-file-lines" aria-hidden="true"></i></span>
                            <input type="text" placeholder="Enter enrollment number">
                        </div>
                        <span class="helper-text">Optional</span>
                    </div>

                    <div class="input-group">
                        <label>Course / Program <span class="req">*</span></label>
                        <select class="select_of_main">
                            <option value="">Select Course</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Department <span class="req">*</span></label>
                        <select class="select_of_main">
                            <option value="">Select Department</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Semester / Year <span class="req">*</span></label>
                        <select class="select_of_main">
                            <option value="">Select Semester / Year</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Session <span class="req">*</span></label>
                        <select class="select_of_main">
                            <option value="">Select Session</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Date of Birth</label>
                        <input type="date">
                    </div>

                    <div class="input-group">
                        <label>Gender <span class="req">*</span></label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="male" checked> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                            <label><input type="radio" name="gender" value="other"> Other</label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Mobile Number <span class="req">*</span></label>
                        <div class="input-wrapper">
                            <span class="icon"><i class="fa-solid fa-phone" aria-hidden="true"></i></span>
                            <input type="tel" placeholder="Enter mobile number">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email ID</label>
                        <div class="input-wrapper">
                            <span class="icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
                            <input type="email" placeholder="Enter college email id">
                        </div>
                    </div>

                    <div class="input-group full-width">
                        <label>Address</label>
                        <div class="input-wrapper">
                            <span class="icon textarea-icon"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></span>
                            <textarea rows="2" placeholder="Enter permanent address..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="photo-section">
                    <label class="photo-title">Student Photo</label>
                    <div class="avatar-placeholder"><i class="fa-solid fa-user" aria-hidden="true"></i></div>
                    <label class="btn-upload">
                        <span>Upload Photo</span>
                        <input type="file" accept="image/png, image/jpeg">
                    </label>
                    <span class="upload-note">(JPG / PNG, Max 2MB)</span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Clear</button>
            </div>
        </form>
    </main>
        <script src="website.js"></script>
</body>
</html>
