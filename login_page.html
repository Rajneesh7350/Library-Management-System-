<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home page - Login</title>

    <link rel="stylesheet" href="login_page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- Header -->
            <div class="brand">

                <div class="book-icon">
                    <i class="fa-solid fa-book-open"></i>
                </div>

                <div>
                    <h1>Library Management System</h1>

                    <p>
                        Manage Books, Students and Library Resources
                    </p>
                </div>

            </div>


            <!-- Login Content -->
            <div class="login-content" id="loginContent">


                <!-- ================= LOGIN FORM ================= -->

                <section class="form-section">

                    <h2>Welcome Back!</h2>

                    <p class="subtitle">
                        Login to continue to your account
                    </p>


                    <form id="loginForm">

                        <!-- Email -->

                        <div class="input-box">

                            <span aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M4 7.5C4 6.67157 4.67157 6 5.5 6H18.5C19.3284 6 20 6.67157 20 7.5V16.5C20 17.3284 19.3284 18 18.5 18H5.5C4.67157 18 4 17.3284 4 16.5V7.5Z"
                                        stroke="currentColor" stroke-width="1.8" />
                                    <path d="M5 7L12 12L19 7" stroke="currentColor" stroke-width="1.8"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>

                            <input type="email" id="email" placeholder="Enter your email or username" required>

                        </div>


                        <!-- Password -->

                        <div class="input-box">

                            <span>🔒</span>

                            <input type="password" id="password" placeholder="Enter your password" required>

                            <button type="button" id="togglePassword" class="eye">
                                👁
                            </button>

                        </div>


                        <!-- Options -->

                        <div class="options">

                            <label>

                                <input type="checkbox">

                                Remember me

                            </label>


                            <a href="#">
                                Forgot Password?
                            </a>

                        </div>


                        <!-- Login -->

                        <button type="submit" class="login-btn">
                            ↪ Login
                        </button>

                    </form>


                    <!-- OR -->

                    <div class="or">

                        <span>OR</span>

                    </div>


                    <!-- Register -->

                    <p class="register">

                        Don't have an account?

                        <a href="#">
                            Register
                        </a>

                    </p>

                </section>



                <!-- ================= LIBRARY PANEL ================= -->

                <section class="info-section" id="infoPanel">

                    <!-- Switch Button -->

                    <button type="button" id="switchButton" class="switch-btn">
                        ⇄
                    </button>


                    <div class="info-content">

                        <h2>
                            Library<br>
                            Management<br>
                            System
                        </h2>


                        <div class="line"></div>


                        <p>
                            Manage library resources
                            <br>
                            efficiently and effectively.
                        </p>

                    </div>


                    <!-- Library Illustration -->

                    <div class="illustration">

                        <div class="books">
                            📚
                        </div>

                        <div class="laptop">
                            💻
                        </div>

                        <div class="open-book">
                            📖
                        </div>

                        <div class="plant">
                            🌿
                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <script src="login_page.js"></script>

</body>

</html>
